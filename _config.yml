title: "jyw10"
tagline: "Notes, experiments, and things worth remembering."
description: "A personal blog about building, learning, and the ideas in between."
url: "https://jyw10.github.io"
baseurl: ""
lang: "en"
timezone: "America/New_York"

author:
  name: "jyw10"
  url: "https://github.com/jyw10"

social:
  name: "jyw10"
  links:
    - "https://github.com/jyw10"

permalink: /writing/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
