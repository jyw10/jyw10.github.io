<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3eee5">
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      }());
    </script>
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">j</span>
          <span>{{ site.title }}</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
          <a {% if page.url == '/archive/' %}aria-current="page"{% endif %} href="{{ '/archive/' | relative_url }}">Archive</a>
          <a {% if page.url == '/about/' %}aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
            <span class="sun" aria-hidden="true">☀</span>
            <span class="moon" aria-hidden="true">◐</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>Thoughtfully made by {{ site.author.name }}.</p>
        <div class="footer-links">
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://github.com/jyw10" rel="me">GitHub</a>
        </div>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
